<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ — moshi shampoo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้า admin */
    .table-wrap {
      overflow-x: auto;
      border: var(--line-soft);
    }

    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--line-soft);
    }

    #ordersTable thead th {
      border-bottom: var(--line);
      background: var(--cream);
      font-weight: 500;
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody td:first-child {
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      #ordersTable th,
      #ordersTable td {
        padding: var(--space-1) var(--space-2);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">moshi shampoo</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <h1>รายการสั่งซื้อ</h1>
          <span class="mood-rule"></span>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">moshi shampoo</span>
      <small>© 2026 moshi shampoo</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
